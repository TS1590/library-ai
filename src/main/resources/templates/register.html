<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 校园图书馆</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;">
    <div class="auth-container">
        <h2>📚 注册新账号</h2>
        <p style="text-align:center;color:#888;margin-bottom:20px;">加入校园图书馆</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form action="/doRegister" method="post">
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" name="username" class="form-control"
                       placeholder="3-20个字符" required minlength="3" maxlength="20">
            </div>
            <div class="form-group">
                <label>密码 *</label>
                <input type="password" name="password" class="form-control"
                       placeholder="至少6位密码" required minlength="6">
            </div>
            <div class="form-group">
                <label>真实姓名 *</label>
                <input type="text" name="realName" class="form-control"
                       placeholder="请输入真实姓名" required>
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" name="phone" class="form-control"
                       placeholder="选填">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" name="email" class="form-control"
                       placeholder="选填">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;">
                注 册
            </button>
        </form>

        <div class="auth-footer">
            已有账号？<a href="/login">返回登录</a>
        </div>
    </div>
</body>
</html>
