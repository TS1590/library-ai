<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('用户管理')"></head>
<body>
    <nav th:replace="fragments/layout :: navbar"></nav>

    <div class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>👥 读者管理</h1>
            </div>

            <div class="table-container" th:if="${page != null and page.records != null and !page.records.isEmpty()}">
                <table>
                    <thead>
                        <tr><th>ID</th><th>用户名</th><th>姓名</th><th>手机</th><th>邮箱</th>
                            <th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${page.records}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.username}">name</td>
                            <td th:text="${user.realName}">姓名</td>
                            <td th:text="${user.phone} ?: '-'">手机</td>
                            <td th:text="${user.email} ?: '-'">邮箱</td>
                            <td>
                                <span th:class="${user.status == 1} ? 'tag tag-success' : 'tag tag-danger'"
                                      th:text="${user.status == 1} ? '正常' : '禁用'"></span>
                            </td>
                            <td>
                                <a th:href="@{/admin/user/toggle/{id}(id=${user.id})}"
                                   th:class="${user.status == 1} ? 'btn btn-sm btn-warning' : 'btn btn-sm btn-success'"
                                   th:text="${user.status == 1} ? '禁用' : '启用'"></a>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- 分页导航 -->
                <div class="pagination" style="display:flex;justify-content:center;align-items:center;gap:16px;padding:16px 0;">
                    <a th:if="${page.current > 1}"
                       th:href="@{/admin/users(page=${page.current - 1}, size=${page.size})}"
                       class="btn btn-outline">← 上一页</a>
                    <span th:unless="${page.current > 1}" class="btn btn-outline" style="opacity:0.4;pointer-events:none;">← 上一页</span>

                    <span style="color:#666;">
                        第 <strong th:text="${page.current}">1</strong> / <strong th:text="${page.pages}">1</strong> 页
                        （共 <strong th:text="${page.total}">0</strong> 条）
                    </span>

                    <a th:if="${page.current < page.pages}"
                       th:href="@{/admin/users(page=${page.current + 1}, size=${page.size})}"
                       class="btn btn-outline">下一页 →</a>
                    <span th:unless="${page.current < page.pages}" class="btn btn-outline" style="opacity:0.4;pointer-events:none;">下一页 →</span>
                </div>
            </div>

            <div th:unless="${page != null and page.records != null and !page.records.isEmpty()}" style="text-align:center;padding:60px;color:#888;">
                📭 暂无读者
            </div>
        </div>
    </div>

    <div th:replace="fragments/layout :: chatbot"></div>
    <footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
