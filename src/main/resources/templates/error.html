<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('出错了')"></head>
<body>
    <nav th:replace="fragments/layout :: navbar"></nav>

    <div class="main-content">
        <div class="container" style="text-align:center;padding:80px 20px;">
            <div style="font-size:80px;margin-bottom:20px;">⚠️</div>
            <h1 th:text="${errorTitle} ?: '系统异常'" style="color:#e74c3c;margin-bottom:16px;">系统异常</h1>
            <p th:text="${errorMessage} ?: '抱歉，系统出现了未预期的错误，请稍后重试。'"
               style="color:#666;font-size:16px;max-width:600px;margin:0 auto 30px;white-space:pre-line;line-height:1.8;">
                错误信息
            </p>
            <div style="display:flex;gap:12px;justify-content:center;">
                <a href="javascript:history.back()" class="btn btn-outline">← 返回上页</a>
                <a href="/" class="btn btn-primary">返回首页</a>
            </div>
        </div>
    </div>

    <footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
