<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 校园图书馆</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;">
    <div class="auth-container">
        <h2>📚 校园图书馆</h2>
        <p style="text-align:center;color:#888;margin-bottom:20px;">登录您的账号</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${param.error}" class="alert alert-error">
            <span th:if="${param.error[0] == 'disabled'}">账号已被禁用，请联系管理员</span>
        </div>

        <form action="/doLogin" method="post">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" class="form-control"
                       placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" class="form-control"
                       placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;">
                登 录
            </button>
        </form>

        <div class="auth-footer">
            还没有账号？<a href="/register">立即注册</a>
        </div>

        <div style="margin-top:16px;padding:12px;background:#f8f9fa;border-radius:8px;font-size:0.85rem;color:#888;">
            <strong>测试账号：</strong><br>
            管理员: admin / admin123<br>
            读 者: reader1 / 123456
        </div>
    </div>
</body>
</html>
